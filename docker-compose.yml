services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__postgres: Host=postgres;Port=5432;Database=urlshortener;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2m
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
